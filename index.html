const STATE={view:'home',step:'entry',draft:{type:'anxiety',name:'',source:'',values:[5,5,5]},records:loadRecords(),activeId:null,mode:'methods',skill:null,filter:'all',detailId:null,sound:false,audio:null,musicTimer:null,breath:{running:false,elapsed:0,last:0,interval:null,done:false}};
let toastTimer=null;
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function loadRecords(){try{let data=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(data)?data.filter(x=>x&&DEF[x.type]&&typeof x.id==='string').map(x=>({...x,before:Array.isArray(x.before)?x.before:[5,5,5],after:Array.isArray(x.after)?x.after:null,methods:Array.isArray(x.methods)?x.methods:[],tasks:Array.isArray(x.tasks)?x.tasks:[],dialogue:x.dialogue||{feeling:'',need:'',note:''}})):[]}catch{return []}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(STATE.records));return true}catch{notify('目前瀏覽器無法儲存，請檢查儲存空間或隱私模式。');return false}}
function freshDraft(){return{type:'anxiety',name:'',source:'',values:[5,5,5]}}
function getRecord(){return STATE.records.find(r=>r.id===STATE.activeId)||null}
function dateStr(d){return new Date(d).toLocaleString('zh-TW',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function shortDate(d){return new Date(d).toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'})}
function identity(){return (crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2))}
function clamp(n,min,max){return Math.min(max,Math.max(min,Number(n)||min))}
function mix(a,b,t){const c=x=>parseInt(x,16);const aa=a.replace('#',''),bb=b.replace('#','');return '#'+[0,2,4].map(i=>Math.round(c(aa.slice(i,i+2))*(1-t)+c(bb.slice(i,i+2))*t).toString(16).padStart(2,'0')).join('')}
function currentColor(type,values){return mix(DEF[type].p[0],DEF[type].p[1],(values[0]-1)/9)}
function pathBlob(cx,cy,rx,ry,kind,rough){const n=14,pts=[];for(let i=0;i<n;i++){const a=(Math.PI*2*i/n)-Math.PI/2;let wav=kind==='stress'?(Math.sin(i*2.65)+Math.cos(i*1.61))*.035:Math.sin(i*1.93)*.014;wav+=rough*Math.sin(i*3.1)*.018;pts.push([cx+Math.cos(a)*rx*(1+wav),cy+Math.sin(a)*ry*(1+wav)])}let d='M '+((pts[n-1][0]+pts[0][0])/2).toFixed(1)+' '+((pts[n-1][1]+pts[0][1])/2).toFixed(1);for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];d+=` Q ${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0]+q[0])/2).toFixed(1)} ${((p[1]+q[1])/2).toFixed(1)}`}return d+' Z'}
function monsterSVG(type,values,animated=true){
 // Slider 1: artwork states 1–3 / 4–7 / 8–10 + gentle scale changes.
 // Slider 2: surrounding thought / weight / ripple marks, independently.
 // Slider 3: subtle posture and accent marks, independently.
 const scores=values.map(x=>clamp(x,1,10));
 const strength=scores[0], secondary=scores[1], tertiary=scores[2];
 const stage=strength<=3?0:strength<=7?1:2;
 const a=(strength-1)/9,b=(secondary-1)/9,c=(tertiary-1)/9;
 const palette={stress:'#c78560',anxiety:'#9877b9',sad:'#83aac2'};
 const accent=palette[type]||palette.anxiety;
 const src=DRAWN_IMAGES[type]?.[stage]||DRAWN_IMAGES.anxiety[1];
 const scale=(.952+a*.07).toFixed(3);
 const angle=(-1+c*2).toFixed(2);
 let extras='';
 const w=(p,opacity)=>`<path d="${p}" fill="none" stroke="${accent}" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" opacity="${opacity}"/>`;
 // A restrained pastel pencil aura makes changes to the second dimension visible
 // without painting over the user's original illustration.
 if(secondary>=3){
  extras+=w('M 33 105 q -8 -9 0 -18 q 8 -9 0 -17',(.13+b*.25).toFixed(2));
 }
 if(secondary>=5){
  extras+=w('M 307 165 q 9 -8 0 -16 q -9 -8 0 -15',(.14+b*.32).toFixed(2));
 }
 if(secondary>=7){
  extras+=w('M 55 245 q 9 -6 18 1 M 267 48 q 6 -8 14 -1',(.16+b*.30).toFixed(2));
 }
 if(secondary>=9){
  extras+=w('M 29 189 q -5 -8 2 -14 M 311 233 q 7 -8 -1 -17',(.20+b*.32).toFixed(2));
 }
 // Distinct third slider: progressively stronger, but low-contrast, small side accents.
 if(tertiary>=3){
  extras+=`<circle cx="40" cy="154" r="${(2.2+3*c).toFixed(2)}" fill="${accent}" opacity="${(.14+c*.27).toFixed(2)}"/>`;
 }
 if(tertiary>=5){
  extras+=`<circle cx="299" cy="88" r="${(2.4+3.5*c).toFixed(2)}" fill="${accent}" opacity="${(.15+c*.30).toFixed(2)}"/>`;
 }
 if(tertiary>=7){
  extras+=w('M 43 221 l -7 7 M 309 114 l 8 -6',(.15+c*.33).toFixed(2));
 }
 if(tertiary>=9){
  extras+=w('M 76 35 l 3 -11 M 278 245 l 8 8',(.20+c*.35).toFixed(2));
 }
 return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 340 310" class="monster-svg ${animated?'monster-animated':''} handdrawn-monster" data-stage="${stage+1}" data-emotion="${type}" data-scores="${scores.join(',')}" role="img" aria-label="${DEF[type].label}怪獸：${stage===0?'低':stage===1?'中':'高'}強度，三項分數 ${scores.join('、')} 分"><g transform="translate(170 155) rotate(${angle}) scale(${scale}) translate(-170 -155)"><image class="drawn-image" x="5" y="3" width="330" height="304" preserveAspectRatio="xMidYMid meet" href="${src}" xlink:href="${src}"/></g>${extras}</svg>`;
}
function notify(text){$('#toastHost').innerHTML=`<div class="toast">${safe(text)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toastHost').innerHTML='',3500)}
function markNav(){ $$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===STATE.view));$('#soundToggle').innerHTML=STATE.sound?'♫ 關閉聲音':'♫ 開啟聲音';$('#soundToggle').setAttribute('aria-pressed',String(STATE.sound))}
function render(){let s='';if(STATE.view==='home')s=pageHome();else if(STATE.view==='create')s=pageCreate();else if(STATE.view==='care')s=pageCare();else s=pageJournal();$('#app').innerHTML=s;markNav();if(STATE.view==='care'&&STATE.skill==='breath')updateBreathUI();}
function route(view){if(STATE.view==='care'&&STATE.skill==='breath')pauseBreath();STATE.view=view;STATE.skill=null;render();window.scrollTo({top:0,behavior:'instant'});}
function startNew(){STATE.draft=freshDraft();STATE.step='entry';STATE.activeId=null;route('create')}
function spark(text){return `<span class="scrap-star ${text}">✳</span>`}
function pageHome(){return `<div class="container hero page"><div class="paper hero-card"><div class="hero-inner"><span class="hero-tag">A LITTLE SPACE FOR YOUR FEELINGS</span><h1>那些說不出口的心情，<br>也有自己的模樣。</h1><p class="hero-sub">把難以描述的感受，變成一隻能看見、能理解的小怪獸。<br>在這裡，陪自己慢慢認識情緒。</p><div class="hero-pic" aria-label="使用原創手繪圖呈現的壓力、焦慮、難過三隻小怪獸"><div class="sticker-monster one">${monsterSVG('stress',[5,6,3])}</div><div class="sticker-monster two">${monsterSVG('anxiety',[5,4,5])}</div><div class="sticker-monster three">${monsterSVG('sad',[5,6,5])}</div>${spark('a')}${spark('b')}${spark('c')}${spark('d')}</div><div class="hero-actions"><button class="btn main" data-action="go-create">開始探索我的情緒 →</button><button class="btn secondary" data-action="go-journal">翻開情緒手帳</button></div><p class="hero-footer">✧ 慢慢來，照自己的步調就好。</p></div></div><div class="home-foot">每一種情緒，都值得被理解。&nbsp; ✳ &nbsp;你的感受由你自己定義。</div></div>`}
function pageCreate(){if(STATE.step==='entry'){return `<div class="container page-area page"><div class="page-heading"><span class="section-kicker">01 / EMOTION CHECK-IN</span><h1 class="page-title">今天，有什麼感受來找你？</h1><p class="lead">先選一個最接近當下心情的類型。事情如果還說不清楚，也可以先不寫。</p><div class="steps"><span class="step on">① 認識感受</span><span>→</span><span class="step">② 塑造怪獸</span></div></div><div class="paper form-paper" style="max-width:780px;margin:auto"><div class="field"><label class="label">我現在比較接近…… <span class="muted small">（必選）</span></label><div class="emotion-choices">${Object.entries(DEF).map(([k,d])=>`<button type="button" class="emotion-choice ${STATE.draft.type===k?'selected':''}" data-action="set-type" data-type="${k}" aria-pressed="${STATE.draft.type===k}"><span class="emotion-dot" style="background:${d.color}">${d.dot}</span><strong>${d.label}</strong><span class="tiny muted">${k==='stress'?'事情好多':k==='anxiety'?'有點不安':'心裡沉沉'}</span></button>`).join('')}</div></div><div class="field"><label class="label" for="source">是什麼讓你有這種感受？ <span class="muted small">（選填）</span></label><textarea class="text-input" id="source" rows="4" maxlength="240" placeholder="例如：最近報告很多，我有點擔心做不完……">${safe(STATE.draft.source)}</textarea><span class="hint">這段文字只會留在你目前使用的瀏覽器中。</span></div><div class="field"><label class="label" for="monsterName">想替這份情緒取個名字嗎？ <span class="muted small">（選填）</span></label><input class="text-input" id="monsterName" maxlength="24" value="${safe(STATE.draft.name)}" placeholder="留空會使用可愛的預設名字"></div><div class="btnline between"><span class="small muted">不需要急著解釋所有感受。</span><button class="btn main" data-action="create-monster">看看我的情緒怪獸 →</button></div></div></div>`}
return `<div class="container page-area page"><div class="page-heading"><span class="section-kicker">02 / MEET YOUR MONSTER</span><h1 class="page-title">讓這份情緒，慢慢有個模樣。</h1><p class="lead">第一個滑桿會切換手繪怪獸的低／中／高情緒表情，另外兩個滑桿也會改變周圍的裝飾和小動作。沒有標準答案，你覺得像就可以了。</p><div class="steps"><span class="step">① 認識感受</span><span>→</span><span class="step on">② 塑造怪獸</span></div></div><div class="soft-grid creator-grid"><section class="paper creator-panel"><div class="row between"><h2 style="margin:0;font-size:1.23rem">調整 ${DEF[STATE.draft.type].label} 的樣子</h2><button class="text-btn small" data-action="back-entry">修改情緒</button></div><p class="small muted" style="margin:8px 0 25px">每個維度可以獨立調整，三個滑桿預設為 5 分。第一項分數 1–3 為低、4–7 為中、8–10 為高。</p>${sliderHtml(STATE.draft.type,STATE.draft.values,'create')}<div class="soft-note">怪獸使用你親手提供的插畫：強度改變表情版本，其餘兩項改變細部效果。任何感受都不是「錯誤的情緒」。</div></section><section class="paper preview-panel"><div class="row between"><span class="pill">✳ 即時情緒畫像</span><span class="small muted">${safe(STATE.draft.name.trim()||DEF[STATE.draft.type].short)}</span></div><div class="monster-stage top-space" id="createMonster">${monsterSVG(STATE.draft.type,STATE.draft.values)}</div><p class="stage-foot">這張手繪表情，像現在的感受嗎？</p><div class="stack top-space"><button class="btn main full" data-action="save-care">保存怪獸，繼續照顧心情 →</button><button class="btn secondary full" data-action="save-journal">先保存，今天到這裡就好</button></div></section></div></div>`}
function sliderHtml(type,vals,place){const d=DEF[type];return d.names.map((n,i)=>`<div class="slidetrack"><div class="slider-head"><label class="label" for="range-${place}-${i}">${i+1}. ${n}</label><span class="slider-value" data-val="${place}-${i}">${vals[i]} / 10</span></div><div class="slider-help">${d.hints[i]}</div><input type="range" class="range" id="range-${place}-${i}" data-slider="${place}" data-index="${i}" min="1" max="10" value="${vals[i]}" step="1" aria-label="${n}"><div class="score-ends"><span>輕微</span><span>強烈</span></div></div>`).join('')}
function createRecord(){const type=STATE.draft.type,values=[...STATE.draft.values];const r={id:identity(),type,name:STATE.draft.name.trim().slice(0,24)||DEF[type].short,source:STATE.draft.source.trim().slice(0,240),before:values,after:null,methods:[],tasks:[],dialogue:{feeling:'',need:'',note:''},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};STATE.records.unshift(r);STATE.activeId=r.id;persist();return r}
function updateRecord(rec){rec.updatedAt=new Date().toISOString();persist()}
function pageCare(){const r=getRecord();if(!r)return `<div class="container page-area page"><div class="paper empty"><div class="empty-icon">☁</div><h2>還沒有正在照顧的怪獸</h2><p>先建立一隻情緒怪獸，再來一起看看可以怎麼照顧感受。</p><button class="btn main" data-action="go-create">開始探索</button></div></div>`;
 const vals=r.after||r.before;
 return `<div class="container page-area page"><div class="page-heading"><span class="section-kicker">03 / TAKE A LITTLE CARE</span><h1 class="page-title">和這份情緒，相處一下。</h1><p class="lead">你不需要把怪獸「消滅」。試試適合自己的方式，之後再看看現在的感受是否有變化。</p></div><div class="soft-grid care-grid"><aside class="paper care-side"><div class="row between"><div class="care-name">${safe(r.name)}</div><span class="pill">${DEF[r.type].label}怪獸</span></div><div class="care-mascot" style="margin-top:13px"><div class="monster-stage" id="careMonster">${monsterSVG(r.type,vals)}</div></div><div class="care-detail"><span class="chip">初次強度：${r.before[0]}/10</span>${r.after?`<span class="chip">目前強度：${r.after[0]}/10</span>`:''}</div><p class="tiny muted">怪獸的插畫版本與周圍效果反映你設定的分數；完成練習不會自動修改感受。</p><div class="stack"><button class="btn secondary full" data-action="care-rest">今天先到這裡，保存紀錄</button></div></aside><section class="paper care-main">${STATE.skill?skillHtml(r):STATE.mode==='review'?reviewHtml(r):methodsHtml(r)}</section></div></div>`}
function methodsHtml(r){return `<div class="row between"><h2 style="margin:0;font-size:1.3rem">想先試試哪一種方式？</h2><span class="tiny muted">選擇適合你的節奏</span></div><p class="small muted">你可以自由選擇、重複練習或略過。已做過的練習也可以再做一次。</p><div class="care-actions top-space">${[{id:'breath',icon:'◉',title:'呼吸練習',desc:'跟著柔和的光球，慢慢吸氣、吐氣，讓自己停留片刻。'},{id:'tasks',icon:'▤',title:'任務拆解',desc:'把看起來很大的一件事，拆成幾個容易開始的小步驟。'},{id:'talk',icon:'♡',title:'情緒對話',desc:'試著為感受命名，看看現在最需要什麼。'}].map(s=>`<article class="care-card"><div class="row"><span class="method-icon">${s.icon}</span><div style="flex:1"><h3>${s.title}</h3><p>${s.desc}</p></div>${r.methods.includes(s.id)?'<span class="method-done">已體驗 ✓</span>':''}</div><div><button class="btn small-btn" data-action="open-skill" data-skill="${s.id}">${r.methods.includes(s.id)?'再練習一次':'試試看'} →</button></div></article>`).join('')}</div><div class="soft-note top-space">沒有哪種練習適合所有情況。如果不舒服，隨時可以停止或選擇其他方式。</div><div class="btnline top-space"><button class="btn main" data-action="go-review">重新看看現在的感受 →</button><button class="btn secondary" data-action="care-rest">先保留現在的樣子</button></div>`}
function skillHtml(r){if(STATE.skill==='breath')return `<div class="skill-head"><div><span class="section-kicker">A MOMENT TO BREATHE</span><h2 style="margin:5px 0">呼吸練習</h2></div><button class="btn secondary small-btn" data-action="close-skill">← 返回</button></div><p class="small muted">舒適地吸氣 4 秒、吐氣 4 秒，共 4 個循環。跟不上也沒關係，不用憋氣；若感到頭暈或不舒服，請停下來。</p><div class="breath-orb"><div id="breathBall" class="breath-circle"></div><div class="breath-words" id="breathWords">準備好時，按下開始</div></div><div class="row between top-space"><span class="label" id="breathCount">0 / 4 循環</span><span class="label" id="breathSecs">剩餘 32 秒</span></div><div class="breath-progress"><span id="breathFill"></span></div><div class="btnline top-space"><button class="btn main" id="breathControl" data-action="breath-toggle">開始呼吸</button><button class="btn secondary" data-action="breath-reset">重新開始</button><button class="btn secondary hide" id="breathDone" data-action="breath-done">完成練習 ✓</button></div>`;
 if(STATE.skill==='tasks')return `<div class="skill-head"><div><span class="section-kicker">ONE SMALL STEP</span><h2 style="margin:5px 0">任務拆解</h2></div><button class="btn secondary small-btn" data-action="close-skill">← 返回</button></div><p class="small muted">先找出這件事裡「能夠採取行動」的一小部分。寫下至少兩個可行的小步驟；現在不必真的把它們全部做完。</p>${r.source?`<div class="soft-note">你的心事：${safe(r.source)}</div>`:''}<div class="top-space" id="taskList">${r.tasks.map((t,i)=>`<div class="task-item"><input class="task-check" aria-label="完成第 ${i+1} 個任務" type="checkbox" data-task-check="${i}" ${t.done?'checked':''}><input type="text" class="text-input" data-task-text="${i}" maxlength="90" placeholder="第 ${i+1} 個小步驟" value="${safe(t.text)}"><button class="btn small-btn secondary" data-action="remove-task" data-index="${i}" aria-label="刪除第 ${i+1} 個步驟">×</button></div>`).join('')}</div><div class="btnline"><button class="btn secondary small-btn" data-action="add-task">＋ 新增步驟</button><button class="btn main" data-action="tasks-done">完成這次拆解 ✓</button></div><p class="tiny muted">如目前的困擾無法立即解決，也可以改試其他方法。</p>`;
 const d=r.dialogue||{};const feelings=['害怕','委屈','疲憊','生氣','孤單','緊張','其他'];const needs=['休息','陪伴','有人協助','整理想法','一些空間','其他'];return `<div class="skill-head"><div><span class="section-kicker">LISTEN TO YOURSELF</span><h2 style="margin:5px 0">情緒對話</h2></div><button class="btn secondary small-btn" data-action="close-skill">← 返回</button></div><p class="small muted">不必解釋得很完整，試著選出現在最接近你的感覺與需要。</p><div class="field top-space"><div class="label">除了 ${DEF[r.type].label}，你還感受到什麼？</div><div class="choice-pills">${feelings.map(s=>`<button class="select-pill ${d.feeling===s?'sel':''}" data-action="set-feeling" data-value="${s}" aria-pressed="${d.feeling===s}">${s}</button>`).join('')}</div></div><div class="field"><div class="label">現在的你，可能需要什麼？</div><div class="choice-pills">${needs.map(s=>`<button class="select-pill ${d.need===s?'sel':''}" data-action="set-need" data-value="${s}" aria-pressed="${d.need===s}">${s}</button>`).join('')}</div></div><div class="field"><label for="talkNote" class="label">想對自己說一句話嗎？（選填）</label><textarea id="talkNote" class="text-input" maxlength="200" rows="3" placeholder="例如：現在先做一點點，也已經很好了。">${safe(d.note||'')}</textarea></div><button class="btn main" data-action="talk-done">完成這次對話 ✓</button>`;
}
function reviewHtml(r){const values=r.after||[...r.before];return `<div class="row between"><div><span class="section-kicker">CHECK IN AGAIN</span><h2 style="margin:5px 0">現在的你，感覺如何？</h2></div><button class="btn secondary small-btn" data-action="back-methods">← 其他練習</button></div><p class="small muted">再用三個滑桿調整現在的感受。分數可以上升、下降或維持相同，任何結果都沒有對錯。</p>${sliderHtml(r.type,values,'review')}<div class="review-compare"><div class="review-mini"><div>一開始的怪獸</div>${monsterSVG(r.type,r.before,false)}<div>${r.before.join(' / ')} 分</div></div><div class="review-mini"><div>現在的怪獸</div><div id="reviewMonster">${monsterSVG(r.type,values,false)}</div><div id="reviewNums">${values.join(' / ')} 分</div></div></div><div class="good-note">願意留意自己的感受，就是值得珍惜的一步。不需要因為某個數值沒有降低而責怪自己。</div><div class="btnline top-space"><button class="btn main" data-action="review-done">保存這次的感受 →</button><button class="btn secondary" data-action="care-rest">暫時保存，稍後再說</button></div>`}
function pageJournal(){const list=STATE.records.filter(r=>STATE.filter==='all'||r.type===STATE.filter).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return `<div class="container page-area page"><div class="journal-head"><div><span class="section-kicker">04 / EMOTION JOURNAL</span><h1 class="page-title">我的情緒手帳</h1><p class="lead">每一次願意觀察自己，都是值得留下的紀錄。這裡沒有好或壞的情緒。</p></div><button class="btn main" data-action="go-create">＋ 新增情緒怪獸</button></div><div class="filter-row" aria-label="篩選情緒">${[{id:'all',name:'全部'},...Object.entries(DEF).map(([id,d])=>({id,name:d.label}))].map(x=>`<button class="filter-btn ${STATE.filter===x.id?'active':''}" data-action="set-filter" data-type="${x.id}" aria-pressed="${STATE.filter===x.id}">${x.name}</button>`).join('')}</div>${list.length?`<div class="journal-list top-space">${list.map(r=>`<button class="entry-card" data-action="entry-detail" data-id="${r.id}"><span class="entry-thumb">${monsterSVG(r.type,r.after||r.before,false)}</span><span class="entry-info"><h3>${safe(r.name)} <span class="small muted">· ${DEF[r.type].label}</span></h3><p>${safe(shortDate(r.createdAt))}　第一次 ${r.before[0]}/10${r.after?` → 最近 ${r.after[0]}/10`:''}</p><p>${safe(r.source||'那天還沒有寫下原因。')}</p></span><span class="entry-badge">查看紀錄 →</span></button>`).join('')}</div><div class="row between top-space"><span class="tiny muted">共 ${STATE.records.length} 筆紀錄 · 僅儲存在這個瀏覽器</span><button class="btn danger small-btn" data-action="clear-all">清除全部紀錄</button></div>`:`<div class="paper empty top-space"><div class="empty-icon">☁</div><h2>${STATE.records.length?'這個分類目前沒有紀錄':'你的情緒手帳還是空白的'}</h2><p>${STATE.records.length?'試試其他情緒分類。':'當你準備好的時候，就從一隻小怪獸開始吧。'}</p><button class="btn main" data-action="go-create">${STATE.records.length?'新增怪獸':'認識今天的感受 →'}</button></div>`}<div class="soft-note top-space">隱私提醒：情緒來源與文字可能較私密。本網站不會把紀錄上傳到伺服器，但同一部裝置、同一瀏覽器的其他使用者可能看得到。請避免在共用裝置輸入敏感資訊。</div></div>`}
function detailHtml(r){return `<div class="overlay" data-action="modal-backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="row between"><span class="section-kicker">A PAGE FROM YOUR JOURNAL</span><button class="btn secondary small-btn" data-action="close-detail">關閉 ×</button></div><div class="detail-header"><div>${monsterSVG(r.type,r.after||r.before,false)}</div><div><h2 id="detailTitle">${safe(r.name)}</h2><div class="muted small">${DEF[r.type].label}怪獸</div><div class="tiny muted">${dateStr(r.createdAt)}</div></div></div><div class="detail-fields top-space"><div class="info"><strong>一開始的感受</strong><span>${r.before.join(' / ')} 分</span></div><div class="info"><strong>後來的感受</strong><span>${r.after?r.after.join(' / ')+' 分':'還沒有重新評估'}</span></div><div class="info" style="grid-column:1/-1"><strong>當時在意的事情</strong><span>${safe(r.source||'沒有留下文字描述')}</span></div></div><div class="top-space"><strong class="small">嘗試過的照顧方法</strong><div>${r.methods.length?r.methods.map(x=>`<span class="detail-method">${{breath:'呼吸練習',tasks:'任務拆解',talk:'情緒對話'}[x]||'其他練習'}</span>`).join(''):'<p class="small muted">還沒有記錄調適練習。</p>'}</div></div>${r.tasks.length?`<div class="top-space"><strong class="small">寫下的小步驟</strong><ul>${r.tasks.filter(t=>t.text).map(t=>`<li>${t.done?'✓ ':''}${safe(t.text)}</li>`).join('')}</ul></div>`:''}${r.dialogue?.feeling||r.dialogue?.need||r.dialogue?.note?`<div class="top-space"><strong class="small">那時的心聲</strong><p class="small muted">${safe([r.dialogue.feeling,r.dialogue.need,r.dialogue.note].filter(Boolean).join(' · '))}</p></div>`:''}<div class="btnline top-space"><button class="btn main" data-action="detail-care" data-id="${r.id}">再陪伴這隻怪獸</button><button class="btn danger" data-action="delete-entry" data-id="${r.id}">刪除這筆紀錄</button></div></div></div>`}
function showDetail(id){const r=STATE.records.find(x=>x.id===id);if(!r)return;STATE.detailId=id;$('#modalHost').innerHTML=detailHtml(r);$('.dialog')?.focus?.()}
function closeDetail(){STATE.detailId=null;$('#modalHost').innerHTML=''}
function completeMethod(k){let r=getRecord();if(r&&!r.methods.includes(k)){r.methods.push(k);updateRecord(r)}STATE.skill=null;STATE.mode='methods';render();notify('已記下這次練習，謝謝你願意照顧自己 ♡')}
function stopBreath(){if(STATE.breath.interval)clearInterval(STATE.breath.interval);STATE.breath.interval=null;STATE.breath.running=false}
function pauseBreath(){if(STATE.breath.running){STATE.breath.elapsed=Math.min(32,STATE.breath.elapsed+(Date.now()-STATE.breath.last)/1000);stopBreath()}}
function resetBreath(){stopBreath();STATE.breath={running:false,elapsed:0,last:0,interval:null,done:false};updateBreathUI()}
function updateBreathUI(){if(STATE.view!=='care'||STATE.skill!=='breath')return;const b=STATE.breath,total=Math.min(32,b.elapsed+(b.running?(Date.now()-b.last)/1000:0));const phase=Math.floor(total/4)%2===0?'inhale':'exhale';const n=Math.floor(total/8);const ready=total===0&&!b.running;
 $('#breathBall')?.classList.toggle('inhale',b.running&&phase==='inhale');$('#breathBall')?.classList.toggle('exhale',b.running&&phase==='exhale');
 if($('#breathWords'))$('#breathWords').textContent=b.done?'完成四個循環，謝謝你。':ready?'準備好時，按下開始':b.running?(phase==='inhale'?'慢慢吸氣……':'慢慢吐氣……'):'已暫停，隨時可以繼續';
 if($('#breathSecs'))$('#breathSecs').textContent=`剩餘 ${Math.max(0,Math.ceil(32-total))} 秒`;
 if($('#breathCount'))$('#breathCount').textContent=`${Math.min(n,4)} / 4 循環`;
 if($('#breathFill'))$('#breathFill').style.width=`${total/32*100}%`;
 if($('#breathControl')){$('#breathControl').textContent=b.running?'暫停':total>0?'繼續呼吸':'開始呼吸';$('#breathControl').classList.toggle('hide',b.done)}
 $('#breathDone')?.classList.toggle('hide',!b.done);
}
function breathToggle(){const b=STATE.breath;if(b.done)return;if(b.running){pauseBreath();updateBreathUI();return}b.last=Date.now();b.running=true;b.interval=setInterval(()=>{if(!b.running)return;const v=b.elapsed+(Date.now()-b.last)/1000;if(v>=32){b.elapsed=32;stopBreath();b.done=true;notify('完成四次呼吸循環 ♡')}updateBreathUI()},125);updateBreathUI()}
function touchChoice(el,k,v){const r=getRecord();if(!r)return;r.dialogue[k]=v;updateRecord(r);$$(`[data-action="${k==='feeling'?'set-feeling':'set-need'}"]`).forEach(btn=>{btn.classList.toggle('sel',btn.dataset.value===v);btn.setAttribute('aria-pressed',String(btn.dataset.value===v))})}
function playNote(freq=440,duration=.22,volume=.02){if(!STATE.sound||!STATE.audio)return;try{const c=STATE.audio,now=c.currentTime,osc=c.createOscillator(),g=c.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.025);g.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(g).connect(c.destination);osc.start(now);osc.stop(now+duration+.02)}catch{}}
function musicTick(){if(!STATE.sound||!STATE.audio)return;const notes=[261.63,329.63,392,293.66,349.23,440,246.94,329.63];const ix=Math.floor(Date.now()/3400)%notes.length;playNote(notes[ix],2.8,.007);setTimeout(()=>{if(STATE.sound)playNote(notes[(ix+2)%notes.length]/2,2.3,.005)},450)}
function toggleSound(){if(STATE.sound){STATE.sound=false;clearInterval(STATE.musicTimer);STATE.musicTimer=null;markNav();notify('聲音已關閉');return}try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('不支援');STATE.audio=STATE.audio||new Audio();STATE.audio.resume();STATE.sound=true;musicTick();STATE.musicTimer=setInterval(musicTick,3400);markNav();notify('已開啟柔和背景音樂與操作音效')}catch{notify('此瀏覽器暫時不支援音效')}}
function onClick(e){const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;if(a==='modal-backdrop'&&e.target!==btn)return;if(STATE.sound&&a!=='sound')playNote(523,.11,.014);
 switch(a){
 case 'go-home':closeDetail();route('home');break;
 case 'go-create':closeDetail();startNew();break;
 case 'go-journal':closeDetail();route('journal');break;
 case 'sound':toggleSound();break;
 case 'set-type':STATE.draft.type=btn.dataset.type;$$('.emotion-choice').forEach(x=>{x.classList.toggle('selected',x===btn);x.setAttribute('aria-pressed',String(x===btn))});break;
 case 'create-monster':STATE.draft.source=$('#source').value;STATE.draft.name=$('#monsterName').value;STATE.step='edit';render();window.scrollTo(0,0);break;
 case 'back-entry':STATE.step='entry';render();break;
 case 'save-care':createRecord();STATE.mode='methods';route('care');notify('怪獸已保存至情緒手帳 ♡');break;
 case 'save-journal':createRecord();route('journal');notify('已保存這份感受，之後隨時可以回來。');break;
 case 'care-rest':pauseBreath();STATE.mode='methods';route('journal');notify('目前的情緒已保留在手帳裡。');break;
 case 'open-skill':STATE.skill=btn.dataset.skill;if(STATE.skill==='breath')resetBreath();if(STATE.skill==='tasks'){const r=getRecord();if(r&&r.tasks.length===0){r.tasks=[{text:'',done:false},{text:'',done:false}];updateRecord(r)}}render();break;
 case 'close-skill':pauseBreath();STATE.skill=null;render();break;
 case 'breath-toggle':breathToggle();break;
 case 'breath-reset':resetBreath();break;
 case 'breath-done':if(STATE.breath.done)completeMethod('breath');break;
 case 'add-task':{const r=getRecord();if(r){r.tasks.push({text:'',done:false});updateRecord(r);render()}break}
 case 'remove-task':{const r=getRecord();if(r){r.tasks.splice(Number(btn.dataset.index),1);updateRecord(r);render()}break}
 case 'tasks-done':{const r=getRecord();if(r.tasks.filter(t=>t.text.trim()).length<2){notify('請先寫下至少兩個具體的小步驟。');break}completeMethod('tasks');break}
 case 'set-feeling':touchChoice(btn,'feeling',btn.dataset.value);break;
 case 'set-need':touchChoice(btn,'need',btn.dataset.value);break;
 case 'talk-done':{const r=getRecord();if(!r.dialogue.feeling||!r.dialogue.need){notify('先選擇現在的感受與需要，再完成對話。');break}completeMethod('talk');break}
 case 'go-review':STATE.mode='review';render();break;
 case 'back-methods':STATE.mode='methods';render();break;
 case 'review-done':{const r=getRecord();updateRecord(r);route('journal');notify('已保存你現在的感受，謝謝你留意自己 ♡');break}
 case 'set-filter':STATE.filter=btn.dataset.type;render();break;
 case 'entry-detail':showDetail(btn.dataset.id);break;
 case 'modal-backdrop':case 'close-detail':closeDetail();break;
 case 'detail-care':STATE.activeId=btn.dataset.id;STATE.mode='methods';closeDetail();route('care');break;
 case 'delete-entry':{const r=STATE.records.find(x=>x.id===btn.dataset.id);if(r&&confirm(`確定刪除「${r.name}」的情緒紀錄嗎？刪除後無法復原。`)){STATE.records=STATE.records.filter(x=>x.id!==r.id);if(STATE.activeId===r.id)STATE.activeId=null;persist();closeDetail();render();notify('紀錄已刪除。')}break}
 case 'clear-all':if(STATE.records.length&&confirm('確定要清除全部情緒紀錄嗎？這個動作無法復原。')){STATE.records=[];STATE.activeId=null;persist();render();notify('已清除全部紀錄。')}break;
 }
}
function onInput(e){const el=e.target;
 if(el.id==='source'){STATE.draft.source=el.value;return}
 if(el.id==='monsterName'){STATE.draft.name=el.value;return}
 if(el.id==='talkNote'){const r=getRecord();if(r){r.dialogue.note=el.value;updateRecord(r)}return}
 if(el.dataset.taskText!==undefined){const r=getRecord(),i=Number(el.dataset.taskText);if(r?.tasks[i]){r.tasks[i].text=el.value;updateRecord(r)}return}
 if(el.dataset.slider){const id=el.dataset.slider,i=Number(el.dataset.index),v=clamp(el.value,1,10);if(id==='create'){STATE.draft.values[i]=v;$('#createMonster').innerHTML=monsterSVG(STATE.draft.type,STATE.draft.values)}if(id==='review'){const r=getRecord();if(!r)return;if(!r.after)r.after=[...r.before];r.after[i]=v;$('#reviewMonster').innerHTML=monsterSVG(r.type,r.after,false);$('#reviewNums').textContent=r.after.join(' / ')+' 分';$('#careMonster').innerHTML=monsterSVG(r.type,r.after);updateRecord(r)}const disp=$(`[data-val="${id}-${i}"]`);if(disp)disp.textContent=v+' / 10';return}
}
function onChange(e){const el=e.target;if(el.dataset.taskCheck!==undefined){const r=getRecord(),i=Number(el.dataset.taskCheck);if(r?.tasks[i]){r.tasks[i].done=el.checked;updateRecord(r)}}}
function onKey(e){if(e.key==='Escape'){if(STATE.detailId)closeDetail();else if(STATE.skill){pauseBreath();STATE.skill=null;render()}}}
document.addEventListener('click',onClick);document.addEventListener('input',onInput);document.addEventListener('change',onChange);document.addEventListener('keydown',onKey);
render();
})();

</script>
</body>
</html>
